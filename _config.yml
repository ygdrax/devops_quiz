# Site settings
title: DevOps Knowledge Quiz
description: Test your DevOps skills with questions across different technologies and experience levels
baseurl: "/devops_quiz"
url: "https://ygdrax.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections for questions
collections:
  questions:
    output: false

# Quiz settings
quiz:
  questions_per_session: 10
  levels:
    - junior
    - competent
    - senior
  categories:
    - gitlab
    - github
    - gcp
    - azure
    - aws
    - docker
    - python
    - kubernetes
    - linux
    - monitoring
    - debug
    - network
    - devops-principles
